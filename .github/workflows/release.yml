# Merge to main -> test -> build -> push to ECR. Pushing the "latest" tag fires an
# EventBridge rule that starts CodePipeline, which runs a CodeDeploy blue/green release.
# AWS access is through GitHub OIDC: no AWS keys are stored anywhere.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # lets the job request a GitHub OIDC token

concurrency:
  group: release-main
  cancel-in-progress: false

# Only AWS_REGION and AWS_ROLE_ARN must be set as repository variables. The rest
# default to the names the infra repo creates and can be overridden with variables.
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'onward-prod-order-app' }}
  TASK_FAMILY: ${{ vars.TASK_FAMILY || 'onward-prod-order-app' }}
  CONTAINER_NAME: order-app
  DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}         # empty -> onward-prod-deploy-bundles-<account>-<region>

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: python manage.py test apps --settings=config.settings.test --verbosity 2

  release:
    needs: test
    # Skipped until AWS is set up: the role exists only after the delivery-foundation stack.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build --build-arg APP_VERSION="${GITHUB_SHA::7}" -t app:candidate .

      - name: Smoke test the image
        run: |
          docker run -d --name candidate -p 8000:8000 --read-only --tmpfs /tmp app:candidate
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS localhost:8000/ | grep -q "Onward Logistics"
          test "$(docker exec candidate id -u)" = "10001"
          docker rm -f candidate

      - name: Check repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          missing=""
          [ -n "$AWS_REGION" ] || missing="$missing AWS_REGION"
          [ -n "$AWS_ROLE_ARN" ] || missing="$missing AWS_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Set these repository variables (Settings > Secrets and variables > Actions > Variables):$missing"
            exit 1
          fi
          echo "Region $AWS_REGION, role $AWS_ROLE_ARN, ECR $ECR_REPOSITORY, task family $TASK_FAMILY"

      - name: Get short-lived AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push immutable git-SHA tag
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker tag app:candidate "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Upload deployment bundle (taskdef + appspec)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}   # <account>.dkr.ecr.<region>.amazonaws.com
        run: |
          DEPLOY_BUCKET="${DEPLOY_BUCKET:-onward-prod-deploy-bundles-${REGISTRY%%.*}-${AWS_REGION}}"
          set +e
          ./scripts/build-deploy-bundle.sh build; rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            aws s3 cp build/deploy-bundle.zip "s3://$DEPLOY_BUCKET/deploy/deploy-bundle.zip"
          elif [ $rc -ne 3 ]; then
            exit $rc
          fi

      - name: Move "latest" to this build (starts the release)
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker tag app:candidate "$IMAGE:latest"
          docker push "$IMAGE:latest"
          echo "### Released ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
          echo "CodePipeline will now run a blue/green deployment." >> "$GITHUB_STEP_SUMMARY"
